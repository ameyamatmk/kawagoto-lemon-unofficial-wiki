site_name: 河琴れもん 非公式wiki
site_url: https://lemon-kawagoto-wiki.pages.dev
site_description: VTuber「河琴れもん」の活動や配信アーカイブ（美少女ゲーム雑談、歌枠、ゲーム実況、晩酌雑談）などをまとめた非公式ファンサイトです

theme:
  name: material
  custom_dir: overrides
  language: ja
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え
  features:
    - navigation.instant
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.tabs.link
    - search.suggest
    - search.highlight
  favicon: assets/images/favicon.svg
  icon:
    logo: fontawesome/regular/lemon
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: ja
      # 検索語は分かち書きされないため、索引と検索語の両方を文字種の境目で区切る
      separator: '[\s\-\u3000\u3001\u3002\uff0c\uff0e\u30fb\uff0a\uff01\uff1f]+|(?<=[\u4e00-\u9fff])(?=[\u30a0-\u30ffa-zA-Z])|(?<=[\u30a0-\u30ffa-zA-Z])(?=[\u4e00-\u9fff])|(?<=[a-zA-Z])(?=\d)'
  - macros
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
      js_files:
        - javascripts/external-links.js
      css_files:
        - stylesheets/custom.css

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tilde:
      subscript: false
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
      toc_depth: 3

nav:
  - ホーム: index.md
  - 概要:
      - プロフィール: profile.md
      - 活動年表: history.md
  - イラスト:
      - 自画像: illustrations/portrait.md
      - お絵かき: illustrations/fanwork.md
  - 歌枠:
      - セットリスト: music/utawaku.md
  - 配信アーカイブ:
      - 雑談・晩酌: stream/talk.md
      - びしょげ雑談: stream/bishoge.md
      - ゲーム実況:
          - stream/game/index.md
          - Stardew Valley: stream/game/stardew-valley.md
          - NieR Replicant: stream/game/nier-replicant.md
          - HELLO, HELLO WORLD!: stream/game/hello-hello-world.md
          - Inverted Angel: stream/game/inverted-angel.md
          - D.C. Re:tune: stream/game/dc-retune.md
          - 牧場物語 風のグランドバザール: stream/game/bokumono-bazaar.md
          - Alice's World: stream/game/alices-world.md
          - Unpacking: stream/game/unpacking.md
          - けものティータイム: stream/game/kemono-teatime.md
          - anemoi 体験版: stream/game/anemoi-trial.md
          - マガルミナ体験版: stream/game/magalumina-trial.md
          - 千恋＊万花: stream/game/senren-banka.md
          - でこれいと・でこれいしょん: stream/game/decorate-decoration.md
          - 存在/しないあなた、と私: stream/game/sonzai-shinai-anata-to-watashi.md
          - 代筆屋ワールドワード: stream/game/daihitsuya-world-word.md
          - ミカクテイ事件の観測者: stream/game/mikakutei-jiken.md
          - クロノ・トリガー: stream/game/chrono-trigger.md
          - 魔法少女ノ魔女裁判: stream/game/manosaba.md
          - 単発ゲーム: stream/game/oneshot.md
      - れもらじ（ラジオ）: stream/radio.md
  - その他:
      - コラボ: collab.md
      - グッズ: goods.md
  - 外部リンク（別タブで開く）:
      - YouTube: https://www.youtube.com/@kawagoto_lemon
      - X (旧Twitter): https://x.com/lemonmon017
      - PIXIV FANBOX (手書き日記): https://lemonmon017.fanbox.cc/
      - lit.link: https://lit.link/lemonmon017
  - 更新履歴: changelog.md
  - 免責事項・お問い合わせ: disclaimer.md

copyright: Made with <a href="https://squidfunk.github.io/mkdocs-material/">Material for MkDocs</a>

extra:
  generator: false

extra_css:
  - stylesheets/custom.css

extra_javascript:
  - javascripts/external-links.js
  - javascripts/header-share.js
  - https://platform.twitter.com/widgets.js
  - javascripts/twitter-widgets.js
